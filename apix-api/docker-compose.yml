services:
  api:
    build:
      context: ..
      dockerfile: apix-api/Dockerfile
    container_name: apix-api-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      # Points at a Supabase Postgres project -- set the real value in a
      # local .env (see apix-api/.env.example) rather than hardcoding it here.
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - APIX_RAW_STORE_DIR=/app/data/raw_store
      - API_KEYS={"mospi-nso-key-2026":"NSO_STATISTICIAN","rbi-mpd-key-2026":"RBI_ANALYST"}
      - RATE_LIMIT_PUBLIC=30
      - RATE_LIMIT_AUTH=600
    depends_on:
      redis:
        condition: service_started
    volumes:
      - raw_store_data:/app/data/raw_store

  pipeline:
    build:
      context: ..
      dockerfile: apix-api/Dockerfile
    container_name: apix-pipeline-scheduler
    command: ["python", "-m", "pipeline.scheduler"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - APIX_RAW_STORE_DIR=/app/data/raw_store
    volumes:
      - raw_store_data:/app/data/raw_store

  redis:
    image: redis:7-alpine
    container_name: apix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  raw_store_data:
