# Config-driven scraper source definition.
# Adding a new airline/OTA fixture source is: copy this file, change the
# values, drop it in scrapers/configs/ -- no Python subclass required.
# Schema is documented in scrapers/configs/README.md.

source_key: simulated_indigo
provider_label: "Simulated IndiGo direct channel"
base_url: "https://www.simulated-indigo.local"
channel_type: direct

rate_limit:
  min_delay: 0.0
  max_delay: 0.0

# Placeholder DOM/JSON selectors for when this source graduates from a
# deterministic fixture to a live scraper; unused by the fixture engine today
# but kept here so the config already carries the shape health_check.py's
# SELECTOR_MISS classification is named after.
selectors:
  fare_container: ".flight-card"
  price: ".fare-price"
  flight_no: ".flight-number"

# Flat convenience/booking fee applied to every listing unless a route entry
# sets its own "fee". Direct-channel bookings carry no OTA markup.
fee_model:
  convenience_fee: 0.0

# Advance-purchase-window fare multiplier curve.
window_multiplier:
  1: 1.85
  7: 1.25
  15: 1.0
  30: 0.9
  45: 0.88

# No dark-pattern simulation on a direct-channel source.
dark_patterns: {}

