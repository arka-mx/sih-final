source_key: simulated_makemytrip
provider_label: "Simulated MakeMyTrip OTA fixture"
base_url: "https://www.simulated-makemytrip.local"
channel_type: ota

rate_limit:
  min_delay: 0.0
  max_delay: 0.0

selectors:
  fare_container: ".listingCard"
  price: ".finalPrice"
  flight_no: ".flightNo"

# Per-flight "fee" overrides this default when present (see routes below);
# carrier-level OTA convenience fees vary in the real world.
fee_model:
  convenience_fee: 399

window_multiplier:
  1: 1.85
  7: 1.25
  15: 1.0
  30: 0.9
  45: 0.88

# Deterministic (index-keyed, not random) simulation of listing-page dark
# patterns so the same fixture batch always reproduces the same flagged
# listings across runs:
#  - scarcity_copy_every: every Nth listing renders urgency copy even though
#    seat_availability_flag is still AVAILABLE (copy/flag mismatch flagged by
#    pipeline/dark_pattern_detector.py).
#  - high_demand_every: every Nth listing instead flips seat_availability_flag
#    to FEW_SEATS_LEFT with matching "selling fast" copy.
#  - fare_cookie_every: every Nth listing simulates a fare that climbs on each
#    repeat page view within one browsing session (fare-cookie markup).
dark_patterns:
  scarcity_copy_every: 3
  high_demand_every: 5
  fare_cookie_every: 4

