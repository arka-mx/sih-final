services:
  - type: web
    name: apix-api
    runtime: docker
    dockerfilePath: ./apix-api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APIX_RAW_STORE_DIR
        value: /app/data/raw_store
      - key: API_KEYS
        sync: false
      - key: RATE_LIMIT_PUBLIC
        value: "30"
      - key: RATE_LIMIT_AUTH
        value: "600"

  - type: worker
    name: apix-pipeline-scheduler
    runtime: docker
    dockerfilePath: ./apix-api/Dockerfile
    dockerContext: .
    dockerCommand: python -m pipeline.scheduler
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APIX_RAW_STORE_DIR
        value: /app/data/raw_store
