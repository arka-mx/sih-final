name: Strict CI Pipeline

on:
  push:
    branches: [ main, master, Shuvam, '**' ]
  pull_request:
    branches: [ main, master, Shuvam ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run type-check

      - name: Strict Lint (ESLint)
        run: npm run lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm Audit
        run: npm audit --audit-level=high

  python-tests:
    name: Python Test Suite (pipeline, index math, scrapers, API)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apix_user
          POSTGRES_PASSWORD: apix_secret
          POSTGRES_DB: apix_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apix_user -d apix_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://apix_user:apix_secret@localhost:5432/apix_db
      APIX_RAW_STORE_DIR: /tmp/apix_raw_store
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apix-api/requirements.txt"

      - name: Install Dependencies
        run: pip install -r apix-api/requirements.txt

      - name: Run Root Pipeline / Index Math / Scraper Tests
        run: pytest tests/ -v

      - name: Run API Test Suite
        working-directory: apix-api
        run: pytest tests/ -v

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Production Bundle
        run: npm run build
